<desc id="description">按课本图8.1复原。矩形表示过程，圆角框表示加入／产出；颜色区分必经步骤与酿酒师的选择。保留自流汁、压榨汁和葡萄皮的分流，以及陈年前、陈年后的两次混合和侧向加入的新酒液。常规白葡萄酒先分离果皮，再进行酒精发酵。</desc>
