<svg xmlns="http://www.w3.org/2000/svg" width="480" height="2160" viewBox="0 0 480 2160" role="img" aria-labelledby="title desc"><title id="title">二氧化碳浸渍的两阶段流程</title><desc id="desc">完整果串装罐并通入二氧化碳。第一阶段包括气体中的完整果串、缺氧液体中的完整果粒及底部被自重压破的葡萄；完整果粒进行细胞内转化。基础路径先分离自流酒液、再压榨，二者可汇合，由酵母完成第二阶段酒精发酵。原图提示在此工艺中压榨酒可优于自流酒。较早压榨、不带皮完成时通常简单易饮、低单宁、颜色浅；继续带皮发酵、延后压榨时通常果味更浓、单宁更多、颜色更深。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8c947c"/></marker><radialGradient id="berry" cx="30%" cy="25%"><stop stop-color="#b48a99"/><stop offset="1" stop-color="#704759"/></radialGradient></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#f6f4eb"/><text x="24" y="32" fill="#7a3f54" font-size="14" font-weight="650"><tspan x="24" dy="0">CARBONIC MACERATION</tspan></text><text x="24" y="72" fill="#34412e" font-size="28" font-weight="650"><tspan x="24" dy="0">两阶段流程与带皮选择</tspan></text><g transform="translate(24 102) scale(1.2 1)"><rect x="0" y="0" width="360" height="490" rx="16" fill="#fffdf7" stroke="#d9d9ca"/><text x="20" y="34" fill="#7a3f54" font-size="17" font-weight="650"><tspan x="20" dy="0">01  第一阶段</tspan></text><text x="20" y="72" fill="#34412e" font-size="25" font-weight="650"><tspan x="20" dy="0">完整果粒 · 细胞内转化</tspan></text><text x="20" y="110" fill="#34412e" font-size="20" font-weight="400"><tspan x="20" dy="0">整串装罐，通入 CO₂ 排除氧气</tspan></text><path d="M36 153V345Q36 360 51 360H133Q148 360 148 345V153" fill="#e8ebdc" stroke="#71806a" stroke-width="3"/><path d="M38 290Q88 280 146 290V342Q146 358 130 358H54Q38 358 38 342Z" fill="#d7adb5"/><text x="49" y="147" fill="#6c7e68" font-size="20" font-weight="600"><tspan x="49" dy="0">CO₂</tspan></text><path d="M93 112L93 128" fill="none" stroke="#8c947c" stroke-width="2.4" marker-end="url(#arrow)"/><g transform="translate(60 188) scale(0.8)"><path d="M12 -10L12 0" stroke="#716043" stroke-width="3"/><circle cx="0" cy="0" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="12" cy="0" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="24" cy="0" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="6" cy="11" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="18" cy="11" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="12" cy="22" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/></g><g transform="translate(107 229) scale(0.8)"><path d="M12 -10L12 0" stroke="#716043" stroke-width="3"/><circle cx="0" cy="0" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="12" cy="0" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="24" cy="0" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="6" cy="11" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="18" cy="11" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="12" cy="22" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/></g><g transform="translate(65 309) scale(0.8)"><path d="M12 -10L12 0" stroke="#716043" stroke-width="3"/><circle cx="0" cy="0" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="12" cy="0" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="24" cy="0" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="6" cy="11" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="18" cy="11" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/><circle cx="12" cy="22" r="7" fill="url(#berry)" stroke="#6c4657" stroke-width=".6"/></g><text x="167" y="192" fill="#34412e" font-size="18" font-weight="400"><tspan x="167" dy="0">完整果串</tspan><tspan x="167" dy="27">处于 CO₂ 气体中</tspan></text><text x="167" y="283" fill="#34412e" font-size="18" font-weight="400"><tspan x="167" dy="0">完整果粒</tspan><tspan x="167" dy="27">也可浸在缺氧液体中</tspan></text><text x="20" y="394" fill="#34412e" font-size="19" font-weight="400"><tspan x="20" dy="0">底部部分葡萄被自重压破，流出汁液。</tspan><tspan x="20" dy="29">缺氧使完整果粒内部产生少量酒精</tspan><tspan x="20" dy="29">及特色香气；糖尚未全部发酵完。</tspan></text></g><g transform="translate(24 630) scale(1.2 1)"><rect x="0" y="0" width="360" height="490" rx="16" fill="#fffdf7" stroke="#d9d9ca"/><text x="20" y="34" fill="#7a3f54" font-size="17" font-weight="650"><tspan x="20" dy="0">过渡  分离与压榨</tspan></text><text x="20" y="72" fill="#34412e" font-size="25" font-weight="650"><tspan x="20" dy="0">先取汁的基础路径</tspan></text><text x="20" y="110" fill="#34412e" font-size="20" font-weight="400"><tspan x="20" dy="0">先放出自流汁，再压榨果实</tspan></text><rect x="28" y="146" width="304" height="66" rx="16" fill="#ecefdf" stroke="#d9d9ca"/><text x="50" y="187" fill="#34412e" font-size="20" font-weight="400"><tspan x="50" dy="0">果粒破裂或经压榨释放汁液</tspan></text><path d="M110 212L110 243" fill="none" stroke="#8c947c" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M250 212L250 243" fill="none" stroke="#8c947c" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="20" y="254" width="154" height="77" rx="16" fill="#f5e8e6" stroke="#d9d9ca"/><text x="39" y="287" fill="#34412e" font-size="19" font-weight="400"><tspan x="39" dy="0">自流酒液</tspan><tspan x="39" dy="26">Free-run</tspan></text><rect x="186" y="254" width="154" height="77" rx="16" fill="#ead9df" stroke="#d9d9ca"/><text x="205" y="287" fill="#34412e" font-size="19" font-weight="400"><tspan x="205" dy="0">压榨酒液</tspan><tspan x="205" dy="26">Press wine</tspan></text><path d="M97 331V357H263V331M180 357V385" fill="none" stroke="#8c947c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="20" y="419" fill="#34412e" font-size="19" font-weight="400"><tspan x="20" dy="0">原图中，两者汇合继续完成发酵。</tspan><tspan x="20" dy="29">此工艺中，压榨酒的风味与品质</tspan><tspan x="20" dy="29">可优于自流酒，并非固定品质排序。</tspan></text></g><g transform="translate(24 1158) scale(1.2 1)"><rect x="0" y="0" width="360" height="490" rx="16" fill="#fffdf7" stroke="#d9d9ca"/><text x="20" y="34" fill="#7a3f54" font-size="17" font-weight="650"><tspan x="20" dy="0">02  第二阶段</tspan></text><text x="20" y="72" fill="#34412e" font-size="25" font-weight="650"><tspan x="20" dy="0">酵母完成酒精发酵</tspan></text><text x="20" y="110" fill="#34412e" font-size="20" font-weight="400"><tspan x="20" dy="0">从部分转化到完成发酵</tspan></text><path d="M98 166V313Q98 330 114 330H246Q262 330 262 313V166" fill="#ead9df" stroke="#71806a" stroke-width="3"/><ellipse cx="180" cy="166" rx="82" ry="15" fill="#f9f5eb" stroke="#71806a" stroke-width="3"/><path d="M101 225Q180 211 259 225V310Q259 327 244 327H116Q101 327 101 310Z" fill="#bd8c9b"/><ellipse cx="132" cy="270" rx="4" ry="6" fill="#f6ebd5"/><ellipse cx="177" cy="242" rx="4" ry="6" fill="#f6ebd5"/><ellipse cx="220" cy="287" rx="4" ry="6" fill="#f6ebd5"/><ellipse cx="155" cy="307" rx="4" ry="6" fill="#f6ebd5"/><ellipse cx="235" cy="249" rx="4" ry="6" fill="#f6ebd5"/><text x="140" y="205" fill="#60725a" font-size="19" font-weight="400"><tspan x="140" dy="0">CO₂ ↑</tspan></text><text x="45" y="371" fill="#7a3f54" font-size="24" font-weight="600"><tspan x="45" dy="0">糖 → 酒精 ＋ CO₂</tspan></text><text x="20" y="419" fill="#34412e" font-size="19" font-weight="400"><tspan x="20" dy="0">由酵母把剩余糖继续转化为酒精。</tspan><tspan x="20" dy="29">细胞内阶段结束，并不等于成酒；</tspan><tspan x="20" dy="29">自流酒液和压榨酒液可共同发酵。</tspan></text></g><text x="24" y="1705" fill="#34412e" font-size="26" font-weight="650"><tspan x="24" dy="0">第二阶段：何时压榨？</tspan></text><rect x="24" y="1730" width="432" height="160" rx="16" fill="#f4eee0" stroke="#d9d9ca"/><text x="44" y="1766" fill="#34412e" font-size="23" font-weight="650"><tspan x="44" dy="0">较早压榨 · 不带皮完成</tspan></text><text x="44" y="1806" fill="#34412e" font-size="20" font-weight="400"><tspan x="44" dy="0">先分离果皮，再由酵母完成发酵。</tspan><tspan x="44" dy="29">通常颜色较浅、单宁较少，</tspan><tspan x="44" dy="29">风格简单易饮。</tspan></text><rect x="24" y="1910" width="432" height="160" rx="16" fill="#eadde1" stroke="#d9d9ca"/><text x="44" y="1946" fill="#713c50" font-size="23" font-weight="650"><tspan x="44" dy="0">延后压榨 · 继续带皮发酵</tspan></text><text x="44" y="1986" fill="#34412e" font-size="20" font-weight="400"><tspan x="44" dy="0">保留皮汁接触，更多发酵后再压榨。</tspan><tspan x="44" dy="29">通常果味更浓、单宁更多，</tspan><tspan x="44" dy="29">颜色也更深。</tspan></text><text x="24" y="2106" fill="#65705b" font-size="19" font-weight="400"><tspan x="24" dy="0">基础路径先取汁；带皮变体延后压榨，</tspan><tspan x="24" dy="29">不是已分皮的汁液自动重新带皮。</tspan></text></svg>