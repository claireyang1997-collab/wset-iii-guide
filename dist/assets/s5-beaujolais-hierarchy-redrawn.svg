<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="title desc"><title id="title">Cru、Villages、Beaujolais</title><desc id="desc">自上而下为十个博若莱Cru独立法定产区、Beaujolais-Villages村庄级、Beaujolais大区级。Nouveau新酒来自后两类，不是第四级。博若莱Cru不等同勃艮第Grand Cru。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8c947c"/></marker><radialGradient id="berry" cx="30%" cy="25%"><stop stop-color="#b48a99"/><stop offset="1" stop-color="#704759"/></radialGradient></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#f6f4eb"/><text x="30" y="38" fill="#7a3f54" font-size="16" font-weight="650"><tspan x="30" dy="0">BEAUJOLAIS · APPELLATIONS</tspan></text><text x="30" y="82" fill="#34412e" font-size="34" font-weight="650"><tspan x="30" dy="0">三个层次，看产区名称</tspan></text><rect x="140" y="128" width="720" height="162" rx="12" fill="#744355" stroke="#744355"/><text x="165" y="168" fill="#fffaf1" font-size="27" font-weight="650"><tspan x="165" dy="0">Cru · 十个独立法定产区</tspan></text><text x="165" y="211" fill="#fffaf1" font-size="22" font-weight="400"><tspan x="165" dy="0">酒标突出各自名称，如 Fleurie、Morgon。</tspan><tspan x="165" dy="33">重点比较：风磨坊、摩尔贡；芙蓉、布鲁依。</tspan></text><rect x="90" y="310" width="820" height="142" rx="12" fill="#dce2ce" stroke="#dce2ce"/><text x="115" y="350" fill="#34412e" font-size="27" font-weight="650"><tspan x="115" dy="0">Beaujolais-Villages · 村庄级</tspan></text><text x="115" y="393" fill="#34412e" font-size="22" font-weight="400"><tspan x="115" dy="0">北部与西部丘陵中的 39 个获准村庄。</tspan><tspan x="115" dy="33">可混合不同村庄的葡萄，常用集合名称。</tspan></text><rect x="30" y="472" width="940" height="142" rx="12" fill="#ede5d2" stroke="#ede5d2"/><text x="55" y="512" fill="#34412e" font-size="27" font-weight="650"><tspan x="55" dy="0">Beaujolais · 大区级</tspan></text><text x="55" y="555" fill="#34412e" font-size="22" font-weight="400"><tspan x="55" dy="0">覆盖范围较广，东部与南部平原是教材重点。</tspan><tspan x="55" dy="33">常见风格：果味鲜明、较轻盈，适合年轻饮用。</tspan></text><text x="30" y="657" fill="#713c50" font-size="22" font-weight="600"><tspan x="30" dy="0">Nouveau 来自 Beaujolais 或 Beaujolais-Villages，不是第四级。</tspan></text><text x="30" y="697" fill="#65705b" font-size="20" font-weight="400"><tspan x="30" dy="0">这里的 Cru 是独立产区，不能等同于勃艮第的 Grand Cru 特级葡萄园。</tspan></text></svg>