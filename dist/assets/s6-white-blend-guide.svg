<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="730" viewBox="0 0 1080 730" role="img"><title>白葡萄品种怎样互补</title><rect width="1080" height="730" fill="#fbfaf5"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="47" font-size="30" fill="#36432f" font-weight="650">三种贡献，形成平衡</text><text x="30" y="84" font-size="21" fill="#717966" font-weight="400">先认识特点，再解释混合的目的。</text><rect x="30" y="116" width="332" height="464" rx="14" fill="#e9efdf"/><path d="M54 142h52" stroke="#6d8050" stroke-width="4"/><text x="54" y="185" font-size="30" fill="#36432f" font-weight="650">长相思</text><text x="54" y="216" font-size="18" fill="#6d8050" font-weight="400">Sauvignon Blanc</text><text x="54" y="265" font-size="21" fill="#36432f" font-weight="400">非常芳香 · 较高酸度</text><text x="54" y="299" font-size="21" fill="#36432f" font-weight="400">柑橘、绿色水果与草本</text><text x="54" y="348" font-size="18" fill="#6d8050" font-weight="600">混合中的作用</text><text x="54" y="385" font-size="21" fill="#36432f" font-weight="400">补充酸度、新鲜度和果味</text><text x="54" y="419" font-size="21" fill="#36432f" font-weight="400">也可单酿；甜白中平衡甜度</text><path d="M54 450h284" stroke="#6d8050" opacity=".3"/><text x="54" y="493" font-size="20" fill="#36432f" font-weight="400">普通清新型通常早饮</text><text x="54" y="525" font-size="20" fill="#36432f" font-weight="400">优质桶酿／混合酒可陈年</text><rect x="374" y="116" width="332" height="464" rx="14" fill="#f5ecd1"/><path d="M398 142h52" stroke="#a78b42" stroke-width="4"/><text x="398" y="185" font-size="30" fill="#36432f" font-weight="650">赛美蓉</text><text x="398" y="216" font-size="18" fill="#a78b42" font-weight="400">Sémillon</text><text x="398" y="265" font-size="21" fill="#36432f" font-weight="400">香气较含蓄 · 酸度较低</text><text x="398" y="299" font-size="21" fill="#36432f" font-weight="400">薄皮，容易感染贵腐</text><text x="398" y="348" font-size="18" fill="#a78b42" font-weight="600">混合中的作用</text><text x="398" y="385" font-size="21" fill="#36432f" font-weight="400">增加酒体与饱满质感</text><text x="398" y="419" font-size="21" fill="#36432f" font-weight="400">苏玳等贵腐甜白的重要品种</text><path d="M398 450h284" stroke="#a78b42" opacity=".3"/><text x="398" y="493" font-size="20" fill="#36432f" font-weight="400">讲义“种植面积最大”</text><text x="398" y="525" font-size="20" fill="#36432f" font-weight="400">是旧资料排序，并非恒定</text><rect x="718" y="116" width="332" height="464" rx="14" fill="#eee8ef"/><path d="M742 142h52" stroke="#8c6b85" stroke-width="4"/><text x="742" y="185" font-size="30" fill="#36432f" font-weight="650">密思卡岱</text><text x="742" y="216" font-size="18" fill="#8c6b85" font-weight="400">Muscadelle</text><text x="742" y="265" font-size="21" fill="#36432f" font-weight="400">浓郁的葡萄味和花香</text><text x="742" y="299" font-size="21" fill="#36432f" font-weight="400">香气相似但与Muscat无亲缘</text><text x="742" y="348" font-size="18" fill="#8c6b85" font-weight="600">混合中的作用</text><text x="742" y="385" font-size="21" fill="#36432f" font-weight="400">少量加入，增加芳香层次</text><text x="742" y="419" font-size="21" fill="#36432f" font-weight="400">可用于干白或甜白混合</text><path d="M742 450h284" stroke="#8c6b85" opacity=".3"/><text x="742" y="493" font-size="20" fill="#36432f" font-weight="400">讲义常见用量：小于10%</text><text x="742" y="525" font-size="20" fill="#36432f" font-weight="400">不是全区统一法律上限</text><text x="30" y="632" font-size="27" fill="#36432f" font-weight="600">结论：酒体 + 酸度与清新果味 + 芳香层次</text><text x="30" y="675" font-size="22" fill="#36432f" font-weight="400">根据当年原料与目标风格调整比例；干甜、贵腐和酿造方法共同决定成酒。</text></g></svg>