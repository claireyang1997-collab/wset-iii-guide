<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-labelledby="title desc">
<title id="title">波尔多白葡萄酒的品种怎样互补</title><desc id="desc">长相思提供酸度和清新果香，赛美蓉增加饱满口感，少量密思卡岱增添花香。按各批次表现调整比例，形成最终白葡萄酒。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#8b957c" stroke-width="1.5"/></marker></defs>
<rect width="600" height="650" rx="18" fill="#f8f6ed"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#354333">
<text x="300" y="52" text-anchor="middle" font-size="27" font-weight="600">不同品种，分别带来什么？</text>
<rect x="38" y="91" width="524" height="103" rx="12" fill="#e5ead8"/><circle cx="83" cy="142" r="24" fill="#9aa967"/><text x="128" y="129" font-size="25" font-weight="600">长相思</text><text x="128" y="168" font-size="21">酸度、柑橘与草本香气</text>
<rect x="38" y="211" width="524" height="103" rx="12" fill="#f0e7c9"/><circle cx="83" cy="262" r="24" fill="#c8ac59"/><text x="128" y="249" font-size="25" font-weight="600">赛美蓉</text><text x="128" y="288" font-size="21">较饱满的口感</text>
<rect x="38" y="331" width="524" height="103" rx="12" fill="#e9e7dd"/><circle cx="83" cy="382" r="24" fill="#a9a78c"/><text x="128" y="369" font-size="25" font-weight="600">密思卡岱</text><text x="128" y="408" font-size="21">少量加入，增添花香</text>
<path d="M300 441V475" stroke="#8b957c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="82" y="488" width="436" height="72" rx="12" fill="#dfe5cf"/><text x="300" y="532" text-anchor="middle" font-size="23" font-weight="600">通过混合调整果香、酸度和口感</text>
<text x="300" y="608" text-anchor="middle" font-size="19" fill="#6e765f">比例取决于当年葡萄和酒庄想要的风格。</text>
</g></svg>
