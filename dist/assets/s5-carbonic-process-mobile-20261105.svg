<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1770" viewBox="0 0 640 1770" role="img" aria-labelledby="title desc"><title id="title">二氧化碳浸渍的两阶段流程</title><desc id="desc">二氧化碳浸渍的变种。完整佳美果串入罐并通入CO₂，第一阶段发生缺氧代谢：气体中的完整果粒、缺氧液体中的完整果粒，以及被自重压破果粒流出的葡萄汁。随后分离自流汁，剩余果实压榨得到压榨汁，两者合并，由酵母完成第二阶段酒精发酵。原图对该流程标注压榨酒优于自流酒，此为原图流程说明，并非普遍品质结论。后续不带皮发酵：简单易饮、单宁少、颜色浅；带皮发酵：果味浓郁、单宁较多、颜色较深。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#79896a"/></marker></defs><rect width="640" height="1770" rx="18" fill="#fcfaf4"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" fill="#30392f"><text x="26" y="47" font-size="31" fill="#30392f" font-weight="650" text-anchor="start">二氧化碳浸渍的</text><text x="26" y="89" font-size="31" fill="#30392f" font-weight="650" text-anchor="start">两阶段流程</text><text x="26" y="121" font-size="20" fill="#69735e" font-weight="400" text-anchor="start">Variations of Carbonic Maceration</text><rect x="20" y="151" width="600" height="569" rx="12" fill="#f1f3e9" stroke="#d4d9c9" stroke-width="2"/><text x="42" y="192" font-size="26" fill="#793e50" font-weight="650" text-anchor="start">01  第一阶段 · 入罐与缺氧代谢</text><g transform="translate(91,243) scale(0.7)"><path d="M 0 0 Q -10 -24 15 -30" fill="none" stroke="#75845b" stroke-width="6"/><circle cx="-12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="60" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/></g><path d="M 140 277 H 225" fill="none" stroke="#79896a" stroke-width="3" marker-end="url(#arrow)"/><rect x="249" y="227" width="158" height="171" rx="12" fill="#fcfdf9" stroke="#859375" stroke-width="2"/><path d="M 250 329 H 406 V 387 Q 406 397 395 397 H 261 Q 250 397 250 387 Z" fill="#dbc5c0"/><g transform="translate(300,274) scale(0.45)"><path d="M 0 0 Q -10 -24 15 -30" fill="none" stroke="#75845b" stroke-width="6"/><circle cx="-12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="60" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/></g><g transform="translate(364,337) scale(0.38)"><path d="M 0 0 Q -10 -24 15 -30" fill="none" stroke="#75845b" stroke-width="6"/><circle cx="-12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="60" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/></g><text x="331" y="254" font-size="21" fill="#69735e" font-weight="600" text-anchor="middle">CO₂</text><path d="M 460 237 H 408" fill="none" stroke="#79896a" stroke-width="3" marker-end="url(#arrow)"/><text x="428" y="217" font-size="21" fill="#69735e" font-weight="400" text-anchor="start">通入 CO₂</text><text x="42" y="437" font-size="24" fill="#30392f" font-weight="600" text-anchor="start">完整佳美果串入罐</text><text x="42" y="469" font-size="18" fill="#69735e" font-weight="400" text-anchor="start">Whole clusters · Gamay, France · Encuvage</text><text x="42" y="515" font-size="22" fill="#30392f" font-weight="400" text-anchor="start">• 气体中的完整果粒</text><text x="42" y="550" font-size="22" fill="#30392f" font-weight="400" text-anchor="start">  Whole grapes in CO₂ gas</text><text x="42" y="585" font-size="22" fill="#30392f" font-weight="400" text-anchor="start">• 缺氧液体中的完整果粒</text><text x="42" y="620" font-size="22" fill="#30392f" font-weight="400" text-anchor="start">  Whole grapes in anaerobic liquid</text><text x="42" y="655" font-size="22" fill="#30392f" font-weight="400" text-anchor="start">• 被自重压破果粒流出的葡萄汁</text><text x="42" y="697" font-size="20" fill="#69735e" font-weight="400" text-anchor="start">缺氧代谢 · Anaerobic metabolism</text><path d="M 320 721 V 759" fill="none" stroke="#79896a" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="768" width="600" height="508" rx="12" fill="#f5f1eb" stroke="#d4d9c9" stroke-width="2"/><text x="42" y="809" font-size="26" fill="#793e50" font-weight="650" text-anchor="start">02  第二阶段</text><text x="42" y="847" font-size="26" fill="#793e50" font-weight="650" text-anchor="start">压榨与完成酒精发酵</text><rect x="42" y="874" width="556" height="71" rx="12" fill="#fffdf8" stroke="#d4d9c9" stroke-width="2"/><text x="61" y="904" font-size="22" fill="#30392f" font-weight="400" text-anchor="start">自流汁／自流酒</text><text x="61" y="932" font-size="22" fill="#30392f" font-weight="400" text-anchor="start">Free run</text><rect x="42" y="963" width="556" height="83" rx="12" fill="#fffdf8" stroke="#d4d9c9" stroke-width="2"/><text x="61" y="995" font-size="22" fill="#30392f" font-weight="400" text-anchor="start">剩余果实 → 压榨 Pressing</text><text x="61" y="1026" font-size="22" fill="#30392f" font-weight="400" text-anchor="start">压榨汁／压榨酒 Press wine</text><path d="M 600 912 H 611 V 1066 H 320 V 1081" fill="none" stroke="#79896a" stroke-width="3" marker-end="url(#arrow)"/><path d="M 320 1047 V 1081" fill="none" stroke="#79896a" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="1090" width="556" height="101" rx="12" fill="#e7ecdf" stroke="#a9b59b" stroke-width="2"/><text x="62" y="1128" font-size="25" fill="#30392f" font-weight="600" text-anchor="start">自流汁与压榨汁合并</text><text x="62" y="1166" font-size="25" fill="#30392f" font-weight="600" text-anchor="start">由酵母继续完成酒精发酵</text><text x="42" y="1226" font-size="19" fill="#69735e" font-weight="400" text-anchor="start">原图注：此流程的压榨酒优于自流酒；</text><text x="42" y="1254" font-size="19" fill="#69735e" font-weight="400" text-anchor="start">并非所有酿造方式的普遍品质结论。</text><text x="26" y="1323" font-size="27" fill="#793e50" font-weight="650" text-anchor="start">工艺变种：后续酒精发酵</text><text x="26" y="1360" font-size="27" fill="#793e50" font-weight="650" text-anchor="start">是否带皮？</text><rect x="20" y="1390" width="600" height="151" rx="12" fill="#f1f3e9" stroke="#d4d9c9" stroke-width="2"/><text x="42" y="1431" font-size="25" fill="#30392f" font-weight="600" text-anchor="start">不带皮  Without skin</text><text x="42" y="1474" font-size="23" fill="#30392f" font-weight="400" text-anchor="start">简单易饮 · 单宁少 · 颜色浅</text><text x="42" y="1509" font-size="23" fill="#30392f" font-weight="400" text-anchor="start">Simple · Low tannin · Light colour</text><rect x="20" y="1563" width="600" height="163" rx="12" fill="#f2e8ea" stroke="#dfc5cb" stroke-width="2"/><text x="42" y="1605" font-size="25" fill="#793e50" font-weight="600" text-anchor="start">带皮  With skin</text><text x="42" y="1648" font-size="23" fill="#30392f" font-weight="400" text-anchor="start">果味浓郁 · 单宁较多 · 颜色较深</text><text x="42" y="1683" font-size="23" fill="#30392f" font-weight="400" text-anchor="start">Intense · Higher tannin · Deeper colour</text></g></svg>
