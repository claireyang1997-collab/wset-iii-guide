<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1110" viewBox="0 0 1400 1110" role="img" aria-labelledby="title desc"><title id="title">二氧化碳浸渍的两阶段流程</title><desc id="desc">二氧化碳浸渍的变种。完整佳美果串入罐并通入CO₂，第一阶段发生缺氧代谢：气体中的完整果粒、缺氧液体中的完整果粒，以及被自重压破果粒流出的葡萄汁。随后分离自流汁，剩余果实压榨得到压榨汁，两者合并，由酵母完成第二阶段酒精发酵。原图对该流程标注压榨酒优于自流酒，此为原图流程说明，并非普遍品质结论。后续不带皮发酵：简单易饮、单宁少、颜色浅；带皮发酵：果味浓郁、单宁较多、颜色较深。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#79896a"/></marker></defs><rect width="1400" height="1110" rx="18" fill="#fcfaf4"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" fill="#30392f"><text x="40" y="51" font-size="34" fill="#30392f" font-weight="650" text-anchor="start">二氧化碳浸渍的两阶段流程</text><text x="40" y="82" font-size="19" fill="#69735e" font-weight="400" text-anchor="start">Variations of Carbonic Maceration</text><rect x="34" y="108" width="1332" height="347" rx="12" fill="#f1f3e9" stroke="#d4d9c9" stroke-width="2"/><text x="58" y="148" font-size="27" fill="#793e50" font-weight="650" text-anchor="start">01  第一阶段 · 入罐与缺氧代谢</text><g transform="translate(141,222) scale(0.95)"><path d="M 0 0 Q -10 -24 15 -30" fill="none" stroke="#75845b" stroke-width="6"/><circle cx="-12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="60" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/></g><g transform="translate(224,248) scale(0.65)"><path d="M 0 0 Q -10 -24 15 -30" fill="none" stroke="#75845b" stroke-width="6"/><circle cx="-12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="60" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/></g><text x="62" y="349" font-size="22" fill="#30392f" font-weight="400" text-anchor="start">完整果串入罐</text><text x="62" y="380" font-size="22" fill="#30392f" font-weight="400" text-anchor="start">Whole clusters · Encuvage</text><text x="62" y="411" font-size="22" fill="#30392f" font-weight="400" text-anchor="start">法国佳美 Gamay · France</text><path d="M 254 250 H 336" fill="none" stroke="#79896a" stroke-width="3" marker-end="url(#arrow)"/><rect x="355" y="188" width="244" height="235" rx="8" fill="#fbfcf8" stroke="#859375" stroke-width="2"/><path d="M 355 320 H 599 V 415 Q 599 423 591 423 H 363 Q 355 423 355 415 Z" fill="#dbc5c0"/><path d="M 355 382 H 599 V 415 Q 599 423 591 423 H 363 Q 355 423 355 415 Z" fill="#b7848d"/><text x="468" y="218" font-size="23" fill="#69735e" font-weight="650" text-anchor="middle">CO₂</text><g transform="translate(427,245) scale(0.55)"><path d="M 0 0 Q -10 -24 15 -30" fill="none" stroke="#75845b" stroke-width="6"/><circle cx="-12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="60" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/></g><g transform="translate(530,270) scale(0.5)"><path d="M 0 0 Q -10 -24 15 -30" fill="none" stroke="#75845b" stroke-width="6"/><circle cx="-12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="60" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/></g><g transform="translate(494,333) scale(0.45)"><path d="M 0 0 Q -10 -24 15 -30" fill="none" stroke="#75845b" stroke-width="6"/><circle cx="-12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="0" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="23" cy="20" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="-12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="12" cy="40" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/><circle cx="0" cy="60" r="14" fill="#795c77" stroke="#fcfaf4" stroke-width="2"/></g><path d="M 534 166 V 189" fill="none" stroke="#79896a" stroke-width="3" marker-end="url(#arrow)"/><text x="553" y="177" font-size="21" fill="#69735e" font-weight="400" text-anchor="start">通入 CO₂</text><path d="M 605 269 H 649 M 605 347 H 649 M 605 400 H 649" stroke="#9ca58f" stroke-width="2"/><text x="669" y="253" font-size="24" fill="#30392f" font-weight="400" text-anchor="start">气体中的完整果粒</text><text x="669" y="282" font-size="24" fill="#30392f" font-weight="400" text-anchor="start">Whole grapes in CO₂ gas</text><text x="669" y="333" font-size="24" fill="#30392f" font-weight="400" text-anchor="start">缺氧液体中的完整果粒</text><text x="669" y="362" font-size="24" fill="#30392f" font-weight="400" text-anchor="start">Whole grapes in anaerobic liquid</text><text x="669" y="402" font-size="24" fill="#30392f" font-weight="400" text-anchor="start">被自重压破的果粒流出的葡萄汁</text><text x="1041" y="430" font-size="18" fill="#69735e" font-weight="400" text-anchor="start">Anaerobic metabolism</text><path d="M 474 455 V 492" fill="none" stroke="#79896a" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="498" width="1332" height="297" rx="12" fill="#f5f1eb" stroke="#d4d9c9" stroke-width="2"/><text x="58" y="540" font-size="27" fill="#793e50" font-weight="650" text-anchor="start">02  第二阶段 · 压榨与完成酒精发酵</text><rect x="59" y="601" width="227" height="91" rx="12" fill="#fffdf8" stroke="#d4d9c9" stroke-width="2"/><text x="80" y="638" font-size="23" fill="#30392f" font-weight="400" text-anchor="start">分离果汁与果实</text><text x="80" y="670" font-size="23" fill="#30392f" font-weight="400" text-anchor="start">自流 / 压榨</text><path d="M 288 628 H 320 V 600 H 349" fill="none" stroke="#79896a" stroke-width="3" marker-end="url(#arrow)"/><path d="M 288 670 H 320 V 704 H 349" fill="none" stroke="#79896a" stroke-width="3" marker-end="url(#arrow)"/><rect x="355" y="565" width="335" height="76" rx="12" fill="#fffdf8" stroke="#d4d9c9" stroke-width="2"/><text x="376" y="596" font-size="23" fill="#30392f" font-weight="400" text-anchor="start">自流汁／自流酒</text><text x="376" y="625" font-size="23" fill="#30392f" font-weight="400" text-anchor="start">Free run</text><rect x="355" y="660" width="335" height="93" rx="12" fill="#fffdf8" stroke="#d4d9c9" stroke-width="2"/><text x="376" y="690" font-size="22" fill="#30392f" font-weight="400" text-anchor="start">剩余果实 → 压榨 Pressing</text><text x="376" y="724" font-size="22" fill="#30392f" font-weight="400" text-anchor="start">压榨汁／压榨酒 Press wine</text><path d="M 692 602 H 734 V 650 H 784" fill="none" stroke="#79896a" stroke-width="3" marker-end="url(#arrow)"/><path d="M 692 706 H 734 V 650 H 784" fill="none" stroke="#79896a" stroke-width="3" marker-end="url(#arrow)"/><rect x="791" y="584" width="538" height="140" rx="12" fill="#e7ecdf" stroke="#a9b59b" stroke-width="2"/><text x="821" y="624" font-size="26" fill="#30392f" font-weight="600" text-anchor="start">自流汁与压榨汁合并</text><text x="821" y="664" font-size="26" fill="#30392f" font-weight="600" text-anchor="start">由酵母继续完成酒精发酵</text><text x="821" y="700" font-size="18" fill="#69735e" font-weight="400" text-anchor="start">Free run and press wine finish fermentation together</text><text x="58" y="779" font-size="20" fill="#69735e" font-weight="400" text-anchor="start">原图注：此流程的压榨酒优于自流酒；这并非所有酿造方式的普遍品质结论。</text><text x="42" y="850" font-size="29" fill="#793e50" font-weight="650" text-anchor="start">工艺变种：后续酒精发酵是否带皮？</text><text x="42" y="882" font-size="21" fill="#69735e" font-weight="400" text-anchor="start">Subsequent alcoholic fermentation with or without skin?</text><rect x="34" y="911" width="646" height="157" rx="12" fill="#f0f3e9" stroke="#d4d9c9" stroke-width="2"/><rect x="700" y="911" width="666" height="157" rx="12" fill="#f2e8ea" stroke="#dfc5cb" stroke-width="2"/><text x="60" y="953" font-size="27" fill="#30392f" font-weight="600" text-anchor="start">不带皮  Without skin</text><text x="60" y="996" font-size="24" fill="#30392f" font-weight="400" text-anchor="start">简单易饮 · 单宁少 · 颜色浅</text><text x="60" y="1033" font-size="24" fill="#30392f" font-weight="400" text-anchor="start">Simple · Low tannin · Light colour</text><text x="726" y="953" font-size="27" fill="#793e50" font-weight="600" text-anchor="start">带皮  With skin</text><text x="726" y="996" font-size="24" fill="#30392f" font-weight="400" text-anchor="start">果味浓郁 · 单宁较多 · 颜色较深</text><text x="726" y="1033" font-size="24" fill="#30392f" font-weight="400" text-anchor="start">Intense · Higher tannin · Deeper colour</text></g></svg>
