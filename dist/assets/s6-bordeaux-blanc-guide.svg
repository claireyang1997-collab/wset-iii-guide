<rect x="224" y="248" width="152" height="103" rx="5" fill="#fffcf0" stroke="#d7cfb4"/>
<text x="300" y="289" font-family="Georgia,serif" font-size="21">BORDEAUX</text><text x="300" y="325" font-family="Georgia,serif" font-size="24">BLANC</text>
<rect x="35" y="420" width="255" height="106" rx="11" fill="#e7ead9"/><rect x="310" y="420" width="255" height="106" rx="11" fill="#eee6cf"/>
<text x="162" y="459" font-size="25" font-weight="600">Bordeaux</text><text x="162" y="497" font-size="20">波尔多法定产区名称</text>
<text x="438" y="459" font-size="25" font-weight="600">Blanc</text><text x="438" y="497" font-size="20">法语“白葡萄酒”</text>
<text x="300" y="576" font-size="20">本节讨论干白：糖分较少，</text><text x="300" y="608" font-size="20">许多酒款强调清新的果味。</text>
</g></svg>
