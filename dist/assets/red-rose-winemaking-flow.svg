<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1980" viewBox="0 0 1160 1980" role="img" aria-labelledby="title description">
<title id="title">图 9.3 · 干型红葡萄酒和桃红葡萄酒的酿造</title>
<desc id="description">按课本图9.3复原，保留经破碎葡萄与整串葡萄的两条主线，以及二氧化碳浸渍、半二氧化碳浸渍、整串加入破碎葡萄中的交叉连接。粉色框为直接压榨、短时间的浸皮、与白葡萄酒混合三种桃红路径；它们表示在相应节点转向桃红工艺，并非必须先完成红酒带皮发酵。发酵后的“自流汁／压榨汁”沿用原图标签，指自流酒／压榨酒。</desc>
