<title id="title">法国 AOP 的总面积 · 讲义列示数据复现</title>
<desc id="desc">波尔多 Bordeaux：107,748 公顷；罗讷河谷 Rhône Valley：64,467 公顷；卢瓦尔河谷 Loire Valley：47,475 公顷；朗格多克 Languedoc：33,000 公顷；勃艮第 Burgundy：32,301 公顷；阿尔萨斯 Alsace：15,529 公顷；博若莱 Beaujolais：13,500 公顷。统计年份未注明，扇形按上述七项数值计算；不是当前法国全部 AOP 面积。</desc>
