<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">纬度与太阳能量分布</title><desc id="d">等量平行光线在赤道附近较集中，在高纬度斜射并分布于较大面积。示意图不按比例。</desc><defs><radialGradient id="sea"><stop stop-color="#eef1df"/><stop offset="1" stop-color="#afc4be"/></radialGradient><clipPath id="globe"><circle cx="660" cy="300" r="220"/></clipPath><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#b7833c" stroke-width="1.5"/></marker></defs><rect width="1000" height="620" rx="18" fill="#f7f3e8"/><text x="45" y="55" fill="#743d49" font-family="serif" font-size="24">FIELD STUDY · 纬度与阳光</text><circle cx="660" cy="300" r="220" fill="url(#sea)" stroke="#637f75" stroke-width="2"/><g clip-path="url(#globe)" stroke="#789181" fill="none" opacity=".5"><ellipse cx="660" cy="300" rx="85" ry="220"/><ellipse cx="660" cy="300" rx="170" ry="220"/><ellipse cx="660" cy="300" rx="220" ry="75"/><ellipse cx="660" cy="300" rx="220" ry="160"/><path d="M440 300H880" stroke-width="2" stroke-dasharray="7 6"/></g><g stroke="#bc8d46" stroke-width="3" marker-end="url(#arrow)"><path d="M180 120H534"/><path d="M180 160H490"/><path d="M180 280H437"/><path d="M180 320H437"/></g><path d="M535 119A220 220 0 0 0 490 160" fill="none" stroke="#743d49" stroke-width="9"/><path d="M441 280A220 220 0 0 0 441 320" fill="none" stroke="#743d49" stroke-width="9"/><g font-family="sans-serif" fill="#354b40" font-size="21"><text x="55" y="113">同量光线</text><text x="55" y="280">同量光线</text><text x="580" y="144">斜射：分布面积更大</text><text x="525" y="294">接近直射：能量较集中</text><text x="795" y="325" font-size="17">赤道</text><text x="655" y="75" font-size="17">北极</text><text x="655" y="550" font-size="17">南极</text></g><text x="48" y="590" font-family="sans-serif" fill="#6a705e" font-size="17">机制示意，不按比例 · 夏季日长是另一个维度，高纬度夏季白昼更长。</text></svg>
