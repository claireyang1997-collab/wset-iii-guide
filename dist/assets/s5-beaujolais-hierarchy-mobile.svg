<svg xmlns="http://www.w3.org/2000/svg" width="480" height="820" viewBox="0 0 480 820" role="img" aria-labelledby="title desc"><title id="title">Cru、Villages、Beaujolais</title><desc id="desc">自上而下为十个博若莱Cru独立法定产区、Beaujolais-Villages村庄级、Beaujolais大区级。Nouveau新酒来自后两类，不是第四级。博若莱Cru不等同勃艮第Grand Cru。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8c947c"/></marker><radialGradient id="berry" cx="30%" cy="25%"><stop stop-color="#b48a99"/><stop offset="1" stop-color="#704759"/></radialGradient></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#f6f4eb"/><text x="24" y="33" fill="#7a3f54" font-size="14" font-weight="650"><tspan x="24" dy="0">BEAUJOLAIS</tspan></text><text x="24" y="72" fill="#34412e" font-size="28" font-weight="650"><tspan x="24" dy="0">三个层次，看产区名称</tspan></text><rect x="24" y="106" width="432" height="159" rx="16" fill="#744355" stroke="#744355"/><text x="42" y="145" fill="#fffaf1" font-size="23" font-weight="650"><tspan x="42" dy="0">Cru · 十个独立法定产区</tspan></text><text x="42" y="187" fill="#fffaf1" font-size="19" font-weight="400"><tspan x="42" dy="0">酒标突出各自名称，如 Fleurie、Morgon。</tspan><tspan x="42" dy="31">重点：风磨坊、摩尔贡；芙蓉、布鲁依。</tspan></text><rect x="24" y="287" width="432" height="159" rx="16" fill="#dce2ce" stroke="#dce2ce"/><text x="42" y="326" fill="#34412e" font-size="23" font-weight="650"><tspan x="42" dy="0">Beaujolais-Villages · 村庄级</tspan></text><text x="42" y="368" fill="#34412e" font-size="19" font-weight="400"><tspan x="42" dy="0">北部与西部丘陵的 39 个获准村庄。</tspan><tspan x="42" dy="31">可混合不同村的葡萄，常用集合名称。</tspan></text><rect x="24" y="468" width="432" height="159" rx="16" fill="#ede5d2" stroke="#ede5d2"/><text x="42" y="507" fill="#34412e" font-size="23" font-weight="650"><tspan x="42" dy="0">Beaujolais · 大区级</tspan></text><text x="42" y="549" fill="#34412e" font-size="19" font-weight="400"><tspan x="42" dy="0">范围较广，教材重点为东部、南部平原。</tspan><tspan x="42" dy="31">常果味鲜明、较轻盈，适合年轻饮用。</tspan></text><text x="24" y="671" fill="#713c50" font-size="20" font-weight="600"><tspan x="24" dy="0">Nouveau 来自大区级或村庄级，</tspan><tspan x="24" dy="30">不是额外的第四级，也不能用于十个 Cru。</tspan></text><text x="24" y="755" fill="#65705b" font-size="19" font-weight="400"><tspan x="24" dy="0">这里的 Cru 是独立产区，不能等同于</tspan><tspan x="24" dy="29">勃艮第的 Grand Cru 特级葡萄园。</tspan></text></svg>