<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1420" viewBox="0 0 600 1420" role="img"><title>白葡萄品种怎样互补</title><rect width="600" height="1420" fill="#fbfaf5"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="26" y="48" font-size="30" fill="#36432f" font-weight="650">白葡萄品种怎样互补？</text><rect x="22" y="82" width="556" height="376" rx="14" fill="#e9efdf"/><text x="46" y="130" font-size="32" fill="#36432f" font-weight="650">长相思</text><text x="46" y="162" font-size="22" fill="#6d8050" font-weight="400">Sauvignon Blanc</text><text x="46" y="208" font-size="26" fill="#36432f" font-weight="400">非常芳香 · 较高酸度</text><text x="46" y="245" font-size="26" fill="#36432f" font-weight="400">柑橘、绿色水果与草本</text><text x="46" y="301" font-size="26" fill="#36432f" font-weight="400">混合作用：补充酸度、新鲜度和果味</text><text x="46" y="338" font-size="26" fill="#36432f" font-weight="400">也可单酿；甜白中平衡甜度</text><text x="46" y="393" font-size="24" fill="#36432f" font-weight="400">普通清新型通常早饮</text><text x="46" y="427" font-size="24" fill="#36432f" font-weight="400">优质桶酿／混合酒可陈年</text><rect x="22" y="482" width="556" height="376" rx="14" fill="#f5ecd1"/><text x="46" y="530" font-size="32" fill="#36432f" font-weight="650">赛美蓉</text><text x="46" y="562" font-size="22" fill="#a78b42" font-weight="400">Sémillon</text><text x="46" y="608" font-size="26" fill="#36432f" font-weight="400">香气较含蓄 · 酸度较低</text><text x="46" y="645" font-size="26" fill="#36432f" font-weight="400">薄皮，容易感染贵腐</text><text x="46" y="701" font-size="26" fill="#36432f" font-weight="400">混合作用：增加酒体与饱满质感</text><text x="46" y="738" font-size="26" fill="#36432f" font-weight="400">苏玳等贵腐甜白的重要品种</text><text x="46" y="793" font-size="24" fill="#36432f" font-weight="400">讲义“种植面积最大”</text><text x="46" y="827" font-size="24" fill="#36432f" font-weight="400">是旧资料排序，并非恒定</text><rect x="22" y="882" width="556" height="376" rx="14" fill="#eee8ef"/><text x="46" y="930" font-size="32" fill="#36432f" font-weight="650">密思卡岱</text><text x="46" y="962" font-size="22" fill="#8c6b85" font-weight="400">Muscadelle</text><text x="46" y="1008" font-size="26" fill="#36432f" font-weight="400">浓郁的葡萄味和花香</text><text x="46" y="1045" font-size="26" fill="#36432f" font-weight="400">香气相似但与Muscat无亲缘</text><text x="46" y="1101" font-size="26" fill="#36432f" font-weight="400">混合作用：少量加入，增加芳香层次</text><text x="46" y="1138" font-size="26" fill="#36432f" font-weight="400">可用于干白或甜白混合</text><text x="46" y="1193" font-size="24" fill="#36432f" font-weight="400">讲义常见用量：小于10%</text><text x="46" y="1227" font-size="24" fill="#36432f" font-weight="400">不是全区统一法律上限</text><text x="26" y="1327" font-size="27" fill="#36432f" font-weight="550">结论：酒体、酸度与果香、芳香互补。</text><text x="26" y="1369" font-size="27" fill="#36432f" font-weight="550">比例看原料与目标，不是固定配方。</text></g></svg>