<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img" aria-labelledby="title desc">
<title id="title">Bordeaux 酒标上的品牌、产区和年份</title><desc id="desc">Kressmann 是品牌，Bordeaux 是波尔多大区法定产区，2010 指葡萄采收年份。</desc><rect width="600" height="850" rx="16" fill="#f8f6ed"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#354333"><text x="30" y="52" font-size="29" font-weight="600">认清品牌、产区和年份</text>
<rect x="70" y="83" width="460" height="238" rx="10" fill="#f7eed7" stroke="#cfc3a6"/>
<g text-anchor="middle" font-family="Georgia,serif"><text x="300" y="143" font-size="34">KRESSMANN</text><path d="M130 167H470" stroke="#b2a17c"/><text x="300" y="220" font-size="43" fill="#803f4d">BORDEAUX</text><text x="300" y="280" font-size="34">2010</text></g>
<rect x="30" y="349" width="540" height="108" rx="12" fill="#e9ecdf"/><text x="53" y="390" font-size="27" font-weight="600">KRESSMANN · 品牌名称</text><text x="53" y="430" font-size="24">告诉我们这款酒使用的品牌。</text>
<rect x="30" y="477" width="540" height="144" rx="12" fill="#f0e2e4"/><text x="53" y="518" font-size="27" font-weight="600" fill="#803f4d">BORDEAUX · 法定产区</text><text x="53" y="560" font-size="24">来自波尔多大区，并符合该名称</text><text x="53" y="596" font-size="24">对应的生产要求。</text>
<rect x="30" y="641" width="540" height="108" rx="12" fill="#e9ecdf"/><text x="53" y="682" font-size="27" font-weight="600">2010 · 葡萄采收年份</text><text x="53" y="722" font-size="24">通常指采收年份，而非装瓶年份。</text>
<text x="300" y="799" text-anchor="middle" font-size="22" fill="#6e765f">品种、用桶与品质，还需查看酒款资料。</text></g></svg>
