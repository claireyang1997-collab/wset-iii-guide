  <title id="title">图 18.1 · 卢瓦尔河谷</title>
  <desc id="description">卢瓦尔河向西流入大西洋。四个葡萄酒产区从西向东依次为南特、安茹–索米尔、图赖讷和中央产区。色块示意各区位置。</desc>
